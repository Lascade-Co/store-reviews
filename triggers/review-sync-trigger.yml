# Copy this file into an APP repo at .github/workflows/review-sync-trigger.yml
# and set the "project_slug" to the app's INFISICAL PROJECT SLUG.
#
# Requirements in the app repo:
#
#   - The app's Infisical project must have a /reviews folder (prod env) with
#     the review-bot keys (APPSTORE_*, GOOGLE_PLAY_*, SLACK_CHANNEL_ID,
#     SLACK_BOT_TOKEN). Omit a platform's keys to skip that platform.
#
# Optional payload key "infisical_env": which Infisical environment to read
# ("production", "staging", or "development"). Absent, null, or any other
# value falls back to production — omit it for normal apps.

name: Trigger Review Sync

on:
  workflow_dispatch:
  schedule:
    # Twice daily at 10:00 and 17:00 IST. GitHub cron is UTC, so
    # 10:00 IST = 04:30 UTC and 17:00 IST = 11:30 UTC. GitHub may delay
    # scheduled runs by a few minutes under load.
    - cron: "30 4,11 * * *"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to central review-bot
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.CENTRAL_DISPATCH_TOKEN }}
          repository: Lascade-Co/store-reviews 
          event-type: review-sync
          # infisical_env is optional: production (default) | staging | development
          client-payload: >-
            {
              "project_slug": "the infisical project slug",
              "infisical_env": "production"
            }
