name: Reply to Review
run-name: "reply · ${{ inputs.app_code }} · ${{ inputs.platform }} · ${{ inputs.review_id }}"

# Workflow 2 of the web dashboard: dispatched from the browser (fine-grained
# PAT with Actions read/write on this repo) when a user clicks Post. The
# dashboard sends the app's appcode; this workflow resolves the matching
# infisical_slug/appname from apps.json, sends the reply to the store, updates
# state, and rebuilds the app's pending-list file on R2 so the dashboard stops
# showing the review.

on:
  workflow_dispatch:
    inputs:
      app_code:
        description: "The app's appcode (from apps.json)"
        required: true
        type: string
      platform:
        description: "Store to reply on"
        required: true
        type: choice
        options: [appstore, playstore]
      review_id:
        description: "Store review id"
        required: true
        type: string
      reply_text:
        description: "The reply to publish"
        required: true
        type: string

# Per-REVIEW group: replies to different reviews (even of the same app) run in
# parallel and never cancel each other — GitHub keeps only one pending run per
# group, so a per-app group would drop rapid same-app replies. State stays safe
# because each reply touches a different review_id and the commit step reconciles
# concurrent pushes via a JSON merge + retry. A double-click on the SAME review
# shares the group, so the duplicate is dropped (post_reply.py also guards by hash).
concurrency:
  group: reply-${{ inputs.app_code }}-${{ inputs.review_id }}
  cancel-in-progress: false

jobs:
  reply:
    name: Send Reply and Update State
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_CODE: ${{ inputs.app_code }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Resolve app from apps.json
        # The dashboard only knows the appcode; look up the matching Infisical
        # slug (to fetch secrets) and display name from apps.json.
        id: app
        run: |
          set -euo pipefail
          obj="$(jq -c --arg c "${APP_CODE}" '.apps[] | select(.appcode == $c)' apps.json)"
          if [ -z "${obj}" ]; then
            echo "No app in apps.json has appcode '${APP_CODE}'." >&2
            exit 1
          fi
          echo "infisical_slug=$(echo "${obj}" | jq -r '.infisical_slug')" >> "$GITHUB_OUTPUT"
          echo "appname=$(echo "${obj}" | jq -r '.appname')" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch review secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ steps.app.outputs.infisical_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /reviews
          export-type: env
      - name: Send Reply to Store
        env:
          APP_NAME: ${{ steps.app.outputs.appname }}
          APP_INFISICAL_SLUG: ${{ steps.app.outputs.infisical_slug }}
          PLATFORM: ${{ inputs.platform }}
          REVIEW_ID: ${{ inputs.review_id }}
          REPLY_TEXT: ${{ inputs.reply_text }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_DATA_PREFIX: ${{ secrets.R2_DATA_PREFIX }}
        run: python scripts/post_reply.py
      - name: Commit Updated State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          APP_DIR="state/${APP_CODE}"
          git add "${APP_DIR}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          merge_remote_state() {
            provider="$1"
            local_file="${APP_DIR}/${provider}.json"
            remote_file="/tmp/remote_${APP_CODE}_${provider}.json"
            [ -f "${local_file}" ] || return 0
            if git show "origin/${GITHUB_REF_NAME}:${local_file}" > "${remote_file}" 2>/dev/null; then
              python scripts/merge_state.py "${remote_file}" "${local_file}"
            fi
          }

          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            merge_remote_state appstore
            merge_remote_state playstore
            python scripts/prune_state.py "${APP_DIR}/appstore.json"
            python scripts/prune_state.py "${APP_DIR}/playstore.json"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add "${APP_DIR}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Remote already contains the state changes."
              exit 0
            fi
            git commit -m "Record dashboard reply (${APP_CODE})"
            if git push; then
              echo "State pushed on attempt ${attempt}/4."
              exit 0
            fi
            echo "Git push rejected; retry ${attempt}/4."
          done

          echo "Unable to push state after 4 attempts."
          exit 1
