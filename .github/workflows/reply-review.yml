name: Reply to Review
run-name: "${{ inputs.action || 'reply' }} · ${{ inputs.app_code }} · ${{ inputs.review_id || 'ALL' }}"

# Workflow 2 of the web dashboard: dispatched from the browser (fine-grained
# PAT with Actions read/write on this repo). One entry point, three actions
# routed by the `action` input to a dedicated job (least-privilege: only `reply`
# gets store credentials; `feed`/`clear` are R2-only):
#   reply  — send a dashboard-approved reply (Reply / Send All). Single mode:
#            platform + review_id + reply_text; batch mode: replies = JSON list.
#            Resolves the app from apps.json, sends to the store, updates state,
#            and rebuilds the app's R2 file so replied reviews drop off.
#   feed   — embed review->reply example pairs (payload = JSON) and upsert them
#            into the RAG corpus immediately (seed/test data).
#   clear  — drop the whole RAG corpus table (reset).
# feed/clear share the `corpus-consolidate` concurrency group so they never write
# the LanceDB table while the sync's consolidation job is writing it.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do: reply | feed | clear"
        required: false
        type: choice
        options: [reply, feed, clear]
        default: reply
      app_code:
        description: "The app's appcode (from apps.json)"
        required: true
        type: string
      payload:
        description: "feed mode: JSON array (or object) of {review, reply, rating}"
        required: false
        type: string
      reply_all:
        description: "Send every reply in `replies` (batch) instead of a single one"
        required: false
        type: boolean
        default: false
      replies:
        description: "Batch mode: JSON array of {platform, review_id, reply_text}"
        required: false
        type: string
      platform:
        # choice keeps dispatch-time validation for single/manual runs. In batch
        # mode this is unused (the per-item platform lives in `replies`); GitHub
        # defaults an omitted choice to the first option, which the batch path ignores.
        description: "Single mode: store to reply on"
        required: false
        type: choice
        options: [appstore, playstore]
      review_id:
        description: "Single mode: store review id"
        required: false
        type: string
      reply_text:
        description: "Single mode: the reply to publish"
        required: false
        type: string
      is_human:
        # Single mode: true when the operator wrote/edited the reply (vs. accepting
        # an AI suggestion unchanged). Only human replies seed the RAG corpus. In
        # batch mode the per-item "is_human" inside `replies` is used instead.
        description: "Single mode: the reply was written/edited by a human"
        required: false
        type: boolean
        default: false

# Single mode uses a per-REVIEW group so replies to different reviews run in
# parallel and never cancel each other (GitHub keeps only one pending run per
# group). Batch mode has no single review_id, so it falls back to a per-app
# "all" group. State stays safe either way: the commit step reconciles
# concurrent pushes via a JSON merge + retry, and post_reply.py guards each
# reply by hash. review_id is empty in batch mode -> group ...-all.
#
# Known, benign race: a batch (group ...-all) and a single reply to the SAME
# review (group ...-<id>) are in different groups, so they can run at once and
# both send that review's reply. This is harmless — the store reply is
# create-or-replace on both App Store and Google Play (idempotent; the store
# ends with one reply), and merge_state reconciles the two commits. A shared
# per-app group would prevent it but would re-introduce the far worse
# cancel-drop of rapid single replies, so we accept the redundant call.
concurrency:
  group: reply-${{ inputs.app_code }}-${{ inputs.review_id || 'all' }}
  cancel-in-progress: false

defaults:
  run:
    shell: seal-bash-e {0}

jobs:
  reply:
    name: Send Reply and Update State
    if: ${{ inputs.action == 'reply' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      APP_CODE: ${{ inputs.app_code }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      # Reviewed main blocks direct pushes except from the CI App (a ruleset bypass actor),
      # so the state commit pushes with an App token, not GITHUB_TOKEN.
      - name: Create CI App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Lascade-Co
          repositories: store-reviews
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Resolve app from apps.json
        # The dashboard only knows the appcode; look up the matching Infisical
        # slug (to fetch secrets) and display name from apps.json.
        id: app
        run: |
          set -euo pipefail
          obj="$(jq -c --arg c "${APP_CODE}" '.apps[] | select(.appcode == $c)' apps.json)"
          if [ -z "${obj}" ]; then
            echo "No app in apps.json has appcode '${APP_CODE}'." >&2
            exit 1
          fi
          echo "infisical_slug=$(echo "${obj}" | jq -r '.infisical_slug')" >> "$GITHUB_OUTPUT"
          echo "appname=$(echo "${obj}" | jq -r '.appname')" >> "$GITHUB_OUTPUT"
          echo "type=$(echo "${obj}" | jq -r '.type // ""')" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch review secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ steps.app.outputs.infisical_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /reviews
          export-type: env
      - name: Send Reply to Store
        env:
          APP_NAME: ${{ steps.app.outputs.appname }}
          APP_INFISICAL_SLUG: ${{ steps.app.outputs.infisical_slug }}
          # App category (flight/car/hotel) stored with each captured corpus pair.
          APP_TYPE: ${{ steps.app.outputs.type }}
          REPLY_ALL: ${{ inputs.reply_all }}
          REPLIES: ${{ inputs.replies }}
          PLATFORM: ${{ inputs.platform }}
          REVIEW_ID: ${{ inputs.review_id }}
          REPLY_TEXT: ${{ inputs.reply_text }}
          # Single mode only; batch items carry per-item is_human inside REPLIES.
          IS_HUMAN: ${{ inputs.is_human }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_DATA_PREFIX: ${{ secrets.R2_DATA_PREFIX }}
        run: python scripts/post_reply.py
      - name: Commit Updated State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          APP_DIR="state/${APP_CODE}"
          git add "${APP_DIR}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          merge_remote_state() {
            provider="$1"
            local_file="${APP_DIR}/${provider}.json"
            remote_file="/tmp/remote_${APP_CODE}_${provider}.json"
            [ -f "${local_file}" ] || return 0
            if git show "origin/${GITHUB_REF_NAME}:${local_file}" > "${remote_file}" 2>/dev/null; then
              python scripts/merge_state.py "${remote_file}" "${local_file}"
            fi
          }

          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            merge_remote_state appstore
            merge_remote_state playstore
            python scripts/prune_state.py "${APP_DIR}/appstore.json"
            python scripts/prune_state.py "${APP_DIR}/playstore.json"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add "${APP_DIR}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Remote already contains the state changes."
              exit 0
            fi
            git commit -m "Record dashboard reply (${APP_CODE})"
            if git push; then
              echo "State pushed on attempt ${attempt}/4."
              exit 0
            fi
            echo "Git push rejected; retry ${attempt}/4."
          done

          echo "Unable to push state after 4 attempts."
          exit 1
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  feed:
    name: Feed corpus examples
    if: ${{ inputs.action == 'feed' }}
    runs-on: ubuntu-latest
    # Reads R2 secrets, so (per the sealed-workflow policy) it runs in an allowed
    # environment. No store credentials — feed only writes the corpus.
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
    # Share the consolidation writer's group: never write the LanceDB table while
    # the sync's consolidate-corpus job is writing it.
    concurrency:
      group: corpus-consolidate
      cancel-in-progress: false
    env:
      APP_CODE: ${{ inputs.app_code }}
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve app from apps.json
        # The dashboard knows only the appcode; look up the app category (type)
        # so fed rows are tagged for type-scoped retrieval.
        id: app
        run: |
          set -euo pipefail
          obj="$(jq -c --arg c "${APP_CODE}" '.apps[] | select(.appcode == $c)' apps.json)"
          if [ -z "${obj}" ]; then
            echo "No app in apps.json has appcode '${APP_CODE}'." >&2
            exit 1
          fi
          echo "type=$(echo "${obj}" | jq -r '.type // ""')" >> "$GITHUB_OUTPUT"
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-bge-m3-v1
      - name: Feed examples into the corpus
        env:
          CORPUS_ACTION: feed
          APP_TYPE: ${{ steps.app.outputs.type }}
          PAYLOAD: ${{ inputs.payload }}
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/corpus_action.py
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1

  clear:
    name: Clear corpus
    if: ${{ inputs.action == 'clear' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: corpus-consolidate
      cancel-in-progress: false
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Clear the corpus table
        env:
          CORPUS_ACTION: clear
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/corpus_action.py
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1
