name: Reply to Review
run-name: "reply · ${{ inputs.project_slug }} · ${{ inputs.platform }} · ${{ inputs.review_id }}"

# Workflow 2 of the web dashboard: dispatched from the browser (fine-grained
# PAT with Actions read/write on this repo) when a user clicks Post. Sends the
# reply to the store, updates state, and rebuilds the app's pending-list file
# on R2 so the dashboard stops showing the review.

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Infisical project slug of the app"
        required: true
        type: string
      platform:
        description: "Store to reply on"
        required: true
        type: choice
        options: [appstore, playstore]
      review_id:
        description: "Store review id"
        required: true
        type: string
      reply_text:
        description: "The reply to publish"
        required: true
        type: string

# Shares the app's group with the sync workflow so state and the data file
# never race; different apps still run in parallel.
concurrency:
  group: review-sync-${{ inputs.project_slug }}
  cancel-in-progress: false

jobs:
  reply:
    name: Send Reply and Update State
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PROJECT_SLUG: ${{ inputs.project_slug }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch review secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ inputs.project_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /reviews
          export-type: env
      - name: Send Reply to Store
        env:
          PLATFORM: ${{ inputs.platform }}
          REVIEW_ID: ${{ inputs.review_id }}
          REPLY_TEXT: ${{ inputs.reply_text }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_DATA_PREFIX: ${{ secrets.R2_DATA_PREFIX }}
        run: python scripts/post_reply.py
      - name: Commit Updated State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          APP_DIR="state/${PROJECT_SLUG}"
          git add "${APP_DIR}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          merge_remote_state() {
            provider="$1"
            local_file="${APP_DIR}/${provider}.json"
            remote_file="/tmp/remote_${PROJECT_SLUG}_${provider}.json"
            [ -f "${local_file}" ] || return 0
            if git show "origin/${GITHUB_REF_NAME}:${local_file}" > "${remote_file}" 2>/dev/null; then
              python scripts/merge_state.py "${remote_file}" "${local_file}"
            fi
          }

          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            merge_remote_state appstore
            merge_remote_state playstore
            python scripts/prune_state.py "${APP_DIR}/appstore.json"
            python scripts/prune_state.py "${APP_DIR}/playstore.json"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add "${APP_DIR}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Remote already contains the state changes."
              exit 0
            fi
            git commit -m "Record dashboard reply (${PROJECT_SLUG})"
            if git push; then
              echo "State pushed on attempt ${attempt}/4."
              exit 0
            fi
            echo "Git push rejected; retry ${attempt}/4."
          done

          echo "Unable to push state after 4 attempts."
          exit 1
