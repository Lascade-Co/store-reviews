name: Review Sync (Central)
run-name: "review-sync · ${{ inputs.app_code || 'all apps' }}"

# Central scheduled sync. One cron here fans out over apps.json and runs every
# app in parallel (one matrix job each) — no per-app trigger repos, no dispatch
# token. Add an app by adding its object to apps.json (appname, appcode,
# infisical_slug). appcode names the R2 file, dashboard URL and state folder;
# infisical_slug fetches the app's secrets; appname is the display name.
# Manual run: use "Run workflow" and optionally set app_code to sync a single
# app; leave it empty to sync every app in apps.json.

on:
  workflow_dispatch:
    inputs:
      app_code:
        description: "Optional single appcode (from apps.json) to sync just that app. Leave empty to sync every app in apps.json."
        required: false
        type: string
  schedule:
    # 02:00 IST daily (cron is UTC; IST = UTC+5:30, so 02:00 IST = 20:30 UTC the
    # previous day). Same time for every app.
    - cron: "30 20 * * *"

jobs:
  set-matrix:
    name: Resolve app list
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.load.outputs.apps }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build matrix from apps.json (or the single manual appcode)
        id: load
        env:
          MANUAL_APP_CODE: ${{ inputs.app_code }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_APP_CODE}" ]; then
            apps="$(jq -c --arg c "${MANUAL_APP_CODE}" '[.apps[] | select(.appcode == $c)]' apps.json)"
            if [ "${apps}" = "[]" ]; then
              echo "No app in apps.json has appcode '${MANUAL_APP_CODE}'." >&2
              exit 1
            fi
          else
            apps="$(jq -c '.apps' apps.json)"
          fi
          echo "Resolved apps: ${apps}"
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

  sync:
    # Web-dashboard mode: both providers run sequentially in ONE job so a
    # single writer produces the app's pending-list file on R2 (no matrix
    # race) and exactly one Slack notification is sent per run. The matrix
    # here is over APPS (one job per app), not providers.
    name: Sync ${{ matrix.app.appcode }}
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.set-matrix.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Per-app group, shared with reply-review.yml, so a sync and a reply for
    # the same app never run at once. Different apps still run in parallel.
    concurrency:
      group: review-sync-${{ matrix.app.appcode }}
      cancel-in-progress: false
    env:
      # `secrets` context is not allowed inside a step-level `if:`; hoist the
      # presence check into a job-level env var (env CAN read secrets) and test
      # that instead. Empty secret -> "false" -> Codex steps skip, sync runs on.
      HAS_CODEX: ${{ secrets.CODEX_AUTH_JSON_BASE_64 != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore Codex auth.json
        # AI-suggested replies use the org Codex CLI authenticated by the shared
        # ChatGPT plan (no per-token OpenAI key). Same pattern as
        # Lascade-Co/actions daily-catchup. Missing secret = suggestions are
        # skipped (ai_reply.py guards on ~/.codex/auth.json), sync still runs.
        if: ${{ env.HAS_CODEX == 'true' }}
        env:
          CODEX_AUTH_JSON_BASE_64: ${{ secrets.CODEX_AUTH_JSON_BASE_64 }}
        run: |
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON_BASE_64" | tr -d '\n\r ' | base64 -d > "$HOME/.codex/auth.json"
      - name: Install Codex CLI and enable its sandbox
        if: ${{ env.HAS_CODEX == 'true' }}
        run: |
          npm install -g @openai/codex
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Fetch review secrets from Infisical
        # Per-app secrets live in the app's Infisical project, folder /reviews.
        # matrix.app.infisical_slug IS the Infisical project slug. export-type
        # env injects each key as a masked env var for the following steps. A
        # platform whose keys are absent from /reviews is skipped by that
        # provider's guard. SLACK_BOT_TOKEN is optional per-app: a non-empty
        # value here overrides the shared default bot provided by the sync step.
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ matrix.app.infisical_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /reviews
          export-type: env
      - name: Sync Reviews and Publish Dashboard Data
        env:
          # appcode names the R2 file, dashboard URL and state folder; appname
          # is the display name. All three go into the R2 file's app_details so
          # the dashboard reads them straight from the data (keyed only by
          # appcode in the URL).
          APP_CODE: ${{ matrix.app.appcode }}
          APP_NAME: ${{ matrix.app.appname }}
          APP_INFISICAL_SLUG: ${{ matrix.app.infisical_slug }}
          # One internal bot serves every app by default, so its token lives
          # once on this repo. An app can still override it by putting its own
          # SLACK_BOT_TOKEN in its Infisical /reviews folder: the code prefers
          # a non-empty Infisical SLACK_BOT_TOKEN and falls back to this
          # default otherwise. In web mode Slack is notify-only (one message
          # per run linking to the dashboard).
          SLACK_BOT_TOKEN_DEFAULT: ${{ secrets.SLACK_BOT_TOKEN }}
          # Cloudflare R2 (dashboard data file). All central-repo secrets;
          # R2_DATA_PREFIX is the unguessable path segment, SITE_BASE_URL is
          # the deployed dashboard used in the Slack notification link.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_DATA_PREFIX: ${{ secrets.R2_DATA_PREFIX }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python scripts/main.py
      - name: Upload State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.appcode }}-state
          path: state/${{ matrix.app.appcode }}/
          if-no-files-found: warn

  commit-state:
    # ONE commit job for the whole run (not one per app). It downloads every
    # app's state artifact, reconstructs each state/<appcode>/ folder, merges +
    # prunes them all, and does a single commit + push. This keeps the job count
    # and wall-clock flat as apps grow (vs a serialized per-app commit matrix).
    # No concurrency group: the fetch+merge+retry below already reconciles a
    # concurrent reply run or an overlapping sync run.
    name: Commit all state
    needs: [set-matrix, sync]
    if: ${{ always() && needs.set-matrix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Download all app state artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          # No name -> all artifacts, each under /tmp/state-artifacts/<appcode>-state/
          path: /tmp/state-artifacts
        continue-on-error: true
      - name: Commit Updated State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reconstruct each app's just-synced state from its artifact. The
          # artifact "<appcode>-state" was uploaded from state/<appcode>/, so its
          # files (appstore.json/playstore.json) sit at the artifact root; copy
          # them back into state/<appcode>/. Record which appcodes we touched.
          shopt -s nullglob
          APPCODES=()
          for dir in /tmp/state-artifacts/*-state; do
            appcode="$(basename "${dir}")"; appcode="${appcode%-state}"
            mkdir -p "state/${appcode}"
            cp -a "${dir}/." "state/${appcode}/"
            APPCODES+=("${appcode}")
          done
          if [ ${#APPCODES[@]} -eq 0 ]; then
            echo "No state artifacts downloaded; nothing to commit."
            exit 0
          fi

          for appcode in "${APPCODES[@]}"; do
            git add "state/${appcode}" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          # Reconcile each app's remote JSON into its just-synced local JSON.
          # merge_state.py merges in JSON space (newest reply timestamp + hash,
          # reply flags) — we do NOT git-rebase these files. Prune AFTER the merge
          # so the union can't resurrect pruned entries. A single commit + push
          # covers every app; the retry rebuilds on the newest remote if a
          # concurrent run (e.g. a reply) advanced the branch.
          #
          # Per-app failures are ISOLATED: if merging/pruning one app throws
          # (e.g. a corrupt state file), that app is warned and dropped (its dir
          # reverted to the committed version) and every other app still commits.
          # So one bad app never blocks the whole run.
          merge_remote_state() {
            local appcode="$1" provider="$2"
            local local_file="state/${appcode}/${provider}.json"
            local remote_file="/tmp/remote_${appcode}_${provider}.json"
            [ -f "${local_file}" ] || return 0
            if git show "origin/${GITHUB_REF_NAME}:${local_file}" > "${remote_file}" 2>/dev/null; then
              python scripts/merge_state.py "${remote_file}" "${local_file}" || return 1
            fi
            return 0
          }

          process_app() {
            local appcode="$1"
            merge_remote_state "${appcode}" appstore || return 1
            merge_remote_state "${appcode}" playstore || return 1
            python scripts/prune_state.py "state/${appcode}/appstore.json" || return 1
            python scripts/prune_state.py "state/${appcode}/playstore.json" || return 1
            return 0
          }

          FAILED=""
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            for appcode in "${APPCODES[@]}"; do
              case " ${FAILED} " in *" ${appcode} "*) continue ;; esac
              if ! process_app "${appcode}"; then
                echo "::warning::State processing failed for ${appcode}; excluding it from this commit (other apps still commit)."
                git checkout "origin/${GITHUB_REF_NAME}" -- "state/${appcode}" 2>/dev/null || rm -rf "state/${appcode}"
                FAILED="${FAILED} ${appcode}"
              fi
            done
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            for appcode in "${APPCODES[@]}"; do
              case " ${FAILED} " in *" ${appcode} "*) continue ;; esac
              git add "state/${appcode}" 2>/dev/null || true
            done
            if git diff --cached --quiet; then
              echo "No state changes to commit.${FAILED:+ (excluded:${FAILED})}"
              exit 0
            fi
            git commit -m "Update review state"
            if git push; then
              echo "State pushed on attempt ${attempt}/4.${FAILED:+ (excluded:${FAILED})}"
              exit 0
            fi
            echo "Git push rejected; another run advanced the branch. Retry ${attempt}/4."
          done

          echo "Unable to push state after 4 attempts."
          exit 1
