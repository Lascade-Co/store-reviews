name: Review Sync (Central)
run-name: "review-sync · ${{ github.event.client_payload.project_slug || inputs.project_slug }}"

on:
  repository_dispatch:
    types: [review-sync]
  workflow_dispatch:
    inputs:
      project_slug:
        description: "Infisical project slug — selects the app's /reviews secrets and names its state folder (state/<project_slug>/)"
        required: true
        type: string

concurrency:
  group: review-sync-${{ github.event.client_payload.project_slug || inputs.project_slug }}
  cancel-in-progress: false

jobs:
  sync:
    # Web-dashboard mode: both providers run sequentially in ONE job so a
    # single writer produces the app's pending-list file on R2 (no matrix
    # race) and exactly one Slack notification is sent per run.
    name: Sync and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # `secrets` context is not allowed inside a step-level `if:`; hoist the
      # presence check into a job-level env var (env CAN read secrets) and test
      # that instead. Empty secret -> "false" -> Codex steps skip, sync runs on.
      HAS_CODEX: ${{ secrets.CODEX_AUTH_JSON_BASE_64 != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore Codex auth.json
        # AI-suggested replies use the org Codex CLI authenticated by the shared
        # ChatGPT plan (no per-token OpenAI key). Same pattern as
        # Lascade-Co/actions daily-catchup. Missing secret = suggestions are
        # skipped (ai_reply.py guards on ~/.codex/auth.json), sync still runs.
        if: ${{ env.HAS_CODEX == 'true' }}
        env:
          CODEX_AUTH_JSON_BASE_64: ${{ secrets.CODEX_AUTH_JSON_BASE_64 }}
        run: |
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON_BASE_64" | tr -d '\n\r ' | base64 -d > "$HOME/.codex/auth.json"
      - name: Install Codex CLI and enable its sandbox
        if: ${{ env.HAS_CODEX == 'true' }}
        run: |
          npm install -g @openai/codex
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Fetch review secrets from Infisical
        # Per-app secrets live in the app's Infisical project, folder /reviews
        # project_slug IS the Infisical project slug. export-type env injects
        # each key as a masked env var for the following steps. A platform
        # whose keys are absent from /reviews is skipped by that provider's
        # guard. SLACK_BOT_TOKEN is optional per-app: a non-empty value here
        # overrides the shared default bot provided by the sync step below.
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug || inputs.project_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /reviews
          export-type: env
      - name: Sync Reviews and Publish Dashboard Data
        env:
          PROJECT_SLUG: ${{ github.event.client_payload.project_slug || inputs.project_slug }}
          # One internal bot serves every app by default, so its token lives
          # once on this repo. An app can still override it by putting its own
          # SLACK_BOT_TOKEN in its Infisical /reviews folder: the code prefers
          # a non-empty Infisical SLACK_BOT_TOKEN and falls back to this
          # default otherwise. In web mode Slack is notify-only (one message
          # per run linking to the dashboard).
          SLACK_BOT_TOKEN_DEFAULT: ${{ secrets.SLACK_BOT_TOKEN }}
          # Cloudflare R2 (dashboard data file). All central-repo secrets;
          # R2_DATA_PREFIX is the unguessable path segment, SITE_BASE_URL is
          # the deployed dashboard used in the Slack notification link.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_DATA_PREFIX: ${{ secrets.R2_DATA_PREFIX }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python scripts/main.py
      - name: Upload State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.project_slug || inputs.project_slug }}-state
          path: state/${{ github.event.client_payload.project_slug || inputs.project_slug }}/
          if-no-files-found: warn

  commit-state:
    name: Commit Updated State
    needs: [sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PROJECT_SLUG: ${{ github.event.client_payload.project_slug || inputs.project_slug }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Download State
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_SLUG }}-state
          path: state/${{ env.PROJECT_SLUG }}
        continue-on-error: true
      - name: Commit Updated State
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          APP_DIR="state/${PROJECT_SLUG}"

          # Detect whether this run produced any state change at all. Add the
          # whole per-app folder so single-platform apps (only one provider
          # file present) still stage cleanly.
          git add "${APP_DIR}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          # Reconcile this app's remote JSON into the just-synced local JSON.
          # merge_state.py merges in JSON space (newest reply timestamp with its
          # matching hash, reply flags, disabled-thread status). This is why we
          # do NOT use `git pull --rebase`: rebasing these files would only
          # produce conflicts a line-based merge cannot resolve.
          merge_remote_state() {
            provider="$1"
            local_file="${APP_DIR}/${provider}.json"
            remote_file="/tmp/remote_${PROJECT_SLUG}_${provider}.json"
            [ -f "${local_file}" ] || return 0
            if git show "origin/${GITHUB_REF_NAME}:${local_file}" > "${remote_file}" 2>/dev/null; then
              python scripts/merge_state.py "${remote_file}" "${local_file}"
            fi
          }

          # Refresh from the latest remote, reconcile, prune, commit, and push on
          # every attempt. Concurrent runs (this app queued, or other apps) can
          # advance the branch between our fetch and push, so a rejected push is
          # retried up to 4 times, each time rebuilding the commit on the newest remote.
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            merge_remote_state appstore
            merge_remote_state playstore
            # Prune AFTER the merge (before add) so the union can't resurrect pruned entries.
            python scripts/prune_state.py "${APP_DIR}/appstore.json"
            python scripts/prune_state.py "${APP_DIR}/playstore.json"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add "${APP_DIR}" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Remote already contains the state changes."
              exit 0
            fi
            git commit -m "Update review state (${PROJECT_SLUG})"
            if git push; then
              echo "State pushed on attempt ${attempt}/4."
              exit 0
            fi
            echo "Git push rejected; another run advanced the branch. Retry ${attempt}/4."
          done

          echo "Unable to push state after 4 attempts."
          exit 1
