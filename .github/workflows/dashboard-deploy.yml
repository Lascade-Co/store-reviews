name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: Lascade-Co/actions/.github/workflows/static-pages-deploy-trigger.yml@main
    with:
      base_path: dashboard
    secrets:
      CI_APP_CLIENT_ID: ${{ secrets.CI_APP_CLIENT_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
